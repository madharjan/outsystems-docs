[project]
name = "outsystems-docs"
version = "1.0.0"
description = "Local MCP server serving OutSystems ODC/O11 documentation"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.8.0",
    "mcp[cli]>=1.27.1",
    "pyyaml>=6.0",
    "hf_xet>=0.3.0",
    "typing_extensions>=4.12.0",
]

[project.scripts]
osdocs-mcp = "osdocs_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osdocs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nuitka>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
