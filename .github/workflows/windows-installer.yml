name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        variant: [standard, directml]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install MSVC Build Tools
        run: choco install visualstudio2022-workload-nativedesktop -y

      - name: Install Nuitka
        run: uv pip install nuitka

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build executables (standard)
        if: matrix.variant == 'standard'
        run: installer\build.cmd all

      - name: Build executables (DirectML GPU)
        if: matrix.variant == 'directml'
        run: installer\build.cmd all --directml

      - name: Build installer
        run: |
          cd installer
          iscc outsystems-docs.iss

      - name: Rename DirectML installer
        if: matrix.variant == 'directml'
        shell: pwsh
        run: Rename-Item -Path 'dist\OutSystems-Docs-Setup.exe' -NewName 'OutSystems-Docs-Setup-DirectML.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.variant }}
          path: dist/OutSystems-Docs-Setup*.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Upload to releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/OutSystems-Docs-Setup*.exe
