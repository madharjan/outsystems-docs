name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Set up MSVC (already installed on windows-latest)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Nuitka
        run: uv pip install nuitka

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build executables
        run: installer\build.cmd all

      - name: Build installer
        run: |
          cd installer
          iscc outsystems-docs.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/OutSystems-Docs-Setup*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Extract release notes for this version
        run: |
          awk -v tag="${{ github.ref_name }}" '
            $0 ~ "^## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - name: Upload to releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/OutSystems-Docs-Setup*.exe
          body_path: release_notes.md
